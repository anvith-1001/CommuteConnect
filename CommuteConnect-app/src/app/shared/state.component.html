<section
  class="state"
  [attr.role]="kind() === 'error' ? 'alert' : 'status'"
  [attr.aria-busy]="kind() === 'loading'"
>
  @if (kind() === 'loading') {
    <span class="spinner" aria-hidden="true"></span>
  }
  <h2>{{ title() }}</h2>
  <p>{{ message() }}</p>
  @if (kind() === 'error') {
    <button class="button secondary" (click)="retry.emit()">Try again</button>
  }
</section>
