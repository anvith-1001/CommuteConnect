@if (totalPages() > 1) {
  <nav class="pagination" aria-label="Pagination">
    <button
      class="button secondary"
      [disabled]="page() <= 1"
      (click)="change.emit(page() - 1)"
    >
      Previous
    </button>
    <span>Page {{ page() }} of {{ totalPages() }}</span>
    <button
      class="button secondary"
      [disabled]="page() >= totalPages()"
      (click)="change.emit(page() + 1)"
    >
      Next
    </button>
  </nav>
}
