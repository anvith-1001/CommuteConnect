<div class="field custom-select" [class.is-open]="open()">
  <label [id]="fieldId() + '-label'">{{ label() }}</label>
  @if (invalid) {
    <div [id]="fieldId() + '-help'" class="field-help field-error">
      Please choose {{ label().toLowerCase() }}.
    </div>
  }
  <button
    class="select-trigger"
    type="button"
    role="combobox"
    [id]="fieldId()"
    [disabled]="disabled"
    [attr.aria-labelledby]="fieldId() + '-label'"
    [attr.aria-controls]="fieldId() + '-options'"
    [attr.aria-expanded]="open()"
    [attr.aria-invalid]="invalid"
    [attr.aria-describedby]="fieldId() + '-help'"
    (click)="toggle()"
    (blur)="onTouched()"
  >
    <span [class.placeholder]="!selectedLabel">
      {{ selectedLabel || placeholder() }}
    </span>
    <span class="select-chevron" aria-hidden="true"></span>
  </button>

  @if (open()) {
    <div class="select-options" role="listbox" [id]="fieldId() + '-options'">
      @for (option of options(); track option.value) {
        <button
          type="button"
          role="option"
          [class.selected]="option.value === value"
          [attr.aria-selected]="option.value === value"
          (click)="choose(option)"
        >
          <span>{{ option.label }}</span>
          @if (option.value === value) {
            <span class="select-check" aria-hidden="true">✓</span>
          }
        </button>
      }
    </div>
  }

  @if (!invalid) {
    <div [id]="fieldId() + '-help'" class="field-help">
      {{ hint() }}
    </div>
  }
</div>
