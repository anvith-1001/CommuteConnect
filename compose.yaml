services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: commuteconnect
      POSTGRES_USER: commuteconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - commute_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commuteconnect -d commuteconnect"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./CommuteConnect-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://commuteconnect:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@database:5432/commuteconnect
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      FRONTEND_ORIGINS: http://localhost:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./CommuteConnect-app
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  commute_data: